<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A fast, elegant Markdown editor and live preview with a VS Code-inspired theme, GitHub-flavored rendering, downloads and recent files."
    />
    <title>Better Markdown — Live Editor & Preview</title>
    <script>
      // No-flash theme: apply the persisted/system theme + accent before first
      // paint. Mirrors src/store/theme-store.ts (key: "bmp-theme").
      (function () {
        try {
          var raw = localStorage.getItem("bmp-theme");
          var state = raw ? JSON.parse(raw).state : {};
          var mode = state.mode || "system";
          var accent = state.accent || "blue";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
